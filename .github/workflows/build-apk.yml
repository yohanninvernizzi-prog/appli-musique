name: Construire l'APK Android

# Lancement manuel : onglet Actions > "Construire l'APK Android" > Run workflow.
# Le résultat est publié dans l'onglet Releases du dépôt, téléchargeable depuis un téléphone.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le code (types et tests)
        run: |
          npx tsc --noEmit
          npx vitest run

      - name: Générer le projet Android
        run: npx expo prebuild --platform android --no-install

      - name: Donner plus de mémoire à Gradle
        # Le fichier généré peut ne pas finir par un retour à la ligne : on en ajoute un avant d'écrire.
        run: printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\n' >> android/gradle.properties

      - name: Construire l'APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --no-daemon --stacktrace

      - name: Diagnostic (uniquement si le build échoue)
        if: failure()
        working-directory: android
        run: |
          echo "--- node / npm ---"; node -v; which node
          echo "--- résolution de react-native ---"
          node --print "require.resolve('react-native/package.json')" || true
          echo "--- autolinking (inline modules) ---"
          node --no-warnings --eval "require('expo/bin/autolinking')" expo-modules-autolinking mirror-kotlin-inline-modules \
            --kotlin-files-mirror-directory "$PWD/../node_modules/expo/android/src/main/java/inline/modules/" \
            --inline-modules-list-directory "$PWD/../node_modules/expo/android/build/inline/modules/" \
            --watched-directories-serialized "[]" || true
          echo "--- autolinking (liste des modules) ---"
          node --no-warnings --eval "require('expo/bin/autolinking')" expo-modules-autolinking resolve --platform android --json | head -c 1500 || true
          echo "--- gradle.properties ---"; cat gradle.properties || true
          echo "--- rapport Gradle ---"; ls build/reports/problems 2>/dev/null || true

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk appli-musique.apk

      - uses: actions/upload-artifact@v4
        with:
          name: appli-musique-apk
          path: appli-musique.apk

      - name: Publier dans les Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG" appli-musique.apk \
            --title "APK n°${{ github.run_number }}" \
            --notes "Build du ${{ github.sha }} (branche ${{ github.ref_name }}). Ouvrir sur la tablette, télécharger appli-musique.apk et l'installer." \
            --prerelease --target "${{ github.sha }}"
