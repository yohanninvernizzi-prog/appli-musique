<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ------------------------------------------------------------------ */
/* Outils                                                              */
/* ------------------------------------------------------------------ */
const M = GEO.meta;
const H = M.hauteurSousPlafond;
const IN = M.interieur;
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const fmt = (n, d = 0) => n.toLocaleString('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d });
const rectOf = o => ({ x0: o.x, y0: o.y, x1: o.x + o.w, y1: o.y + o.d });
const byId = (list, id) => list.find(o => o.id === id);
const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;

function shoelace(poly) {
  let a = 0;
  for (let i = 0; i < poly.length; i++) {
    const [x1, y1] = poly[i], [x2, y2] = poly[(i + 1) % poly.length];
    a += x1 * y2 - x2 * y1;
  }
  return Math.abs(a) / 2;
}
function roomArea(r) {
  if (r.rect) { const [x0, y0, x1, y1] = r.rect; return (x1 - x0) * (y1 - y0); }
  return shoelace(r.poly);
}
function roomCenter(r) {
  if (r.label) return r.label;
  if (r.rect) return [(r.rect[0] + r.rect[2]) / 2, (r.rect[1] + r.rect[3]) / 2];
  const n = r.poly.length; return [r.poly.reduce((s, p) => s + p[0], 0) / n, r.poly.reduce((s, p) => s + p[1], 0) / n];
}

/* ------------------------------------------------------------------ */
/* Rendu                                                               */
/* ------------------------------------------------------------------ */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
app.appendChild(renderer.domElement);
const canvas = renderer.domElement;

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
labelRenderer.domElement.className = 'labels';
app.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8ecef);

const groups = {};
for (const n of ['structure', 'menuiseries', 'plinthes', 'plafond', 'equipements', 'cotes', 'pieces', 'coupe', 'mesure', 'exterieur', 'sol']) {
  groups[n] = new THREE.Group(); groups[n].name = n; scene.add(groups[n]);
}

/* ------------------------------------------------------------------ */
/* Matériaux                                                           */
/* ------------------------------------------------------------------ */
const clipPlane = new THREE.Plane(V3(0, -1, 0), M.coupe);
const clippable = [];
function std(p, clip = true) { const m = new THREE.MeshStandardMaterial(p); if (clip) clippable.push(m); return m; }
const MAT = {
  mur:        std({ color: 0xF2EFE9, roughness: 0.92 }),
  plafond:    std({ color: 0xFFFFFF, roughness: 0.95 }, false),
  plinthe:    std({ color: 0xFFFFFF, roughness: 0.55 }),
  menuiserie: std({ color: 0xFFFFFF, roughness: 0.45 }),
  poignee:    std({ color: 0x1d1d1d, roughness: 0.7, metalness: 0.1 }),
  verre:      std({ color: 0xcfe3ea, roughness: 0.05, transparent: true, opacity: 0.2, depthWrite: false }),
  seuil:      std({ color: 0xbdb8ae, roughness: 0.85 }, false),
  facade:     std({ color: 0x9DAE93, roughness: 0.9 }),
  chene:      std({ color: 0xD8BC90, roughness: 0.6 }),
  blanc:      std({ color: 0xF7F7F5, roughness: 0.5 }),
  ceramique:  std({ color: 0xFCFCFC, roughness: 0.25 }),
  noir:       std({ color: 0x1b1b1b, roughness: 0.3 }),
  inox:       std({ color: 0xa3a8ab, roughness: 0.3, metalness: 0.6 }),
  terrasse:   new THREE.MeshStandardMaterial({ color: 0xA9875F, roughness: 0.85 }),
  solExt:     new THREE.MeshStandardMaterial({ color: 0xc8c4ba, roughness: 1 }),
  coupe:      new THREE.MeshBasicMaterial({ color: 0x3a3f47 })
};

function parquetTexture() {
  const S = 1024, TILE = 200, CM = S / TILE;
  const c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  let seed = 11;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pw = M.parquet.largeurLame * CM;
  const cols = Math.round(TILE / M.parquet.largeurLame);
  const drawPlank = (x, y, w, h) => {
    const l = 74 + rnd() * 7, s = 38 + rnd() * 10, hue = 33 + rnd() * 5;
    g.fillStyle = `hsl(${hue},${s}%,${l}%)`; g.fillRect(x, y, w, h);
    for (let k = 0; k < 22; k++) {
      const gx = x + 3 + rnd() * (w - 6), a = 0.04 + rnd() * 0.08, amp = 1 + rnd() * 3, ph = rnd() * 6;
      g.strokeStyle = `rgba(120,85,45,${a})`; g.lineWidth = 0.6 + rnd() * 1.2; g.beginPath();
      for (let yy = 0; yy <= h; yy += 16) g.lineTo(gx + Math.sin(yy / 90 + ph) * amp, y + yy);
      g.stroke();
    }
    g.strokeStyle = 'rgba(95,65,35,.38)'; g.lineWidth = 1.6; g.strokeRect(x + 0.8, y + 0.8, w - 1.6, h - 1.6);
  };
  for (let i = 0; i < cols; i++) {
    const lens = []; let tot = 0;
    while (tot < S) { const L = (M.parquet.longueurMin + rnd() * (M.parquet.longueurMax - M.parquet.longueurMin)) * CM; lens.push(L); tot += L; }
    lens[lens.length - 1] -= (tot - S);
    if (lens[lens.length - 1] < M.parquet.longueurMin * CM * 0.5 && lens.length > 1) { const last = lens.pop(); lens[lens.length - 1] += last; }
    let y = rnd() * S;
    for (const L of lens) {
      drawPlank(i * pw, y, pw, L);
      if (y + L > S) drawPlank(i * pw, y - S, pw, L);
      y = (y + L) % S;
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

/* ------------------------------------------------------------------ */
/* Primitives                                                          */
/* ------------------------------------------------------------------ */
// Boîte en coordonnées plan : x0..x1, y0..y1 (plan), z0..z1 (hauteur)
function boxMesh(x0, y0, x1, y1, z0, z1, material) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, z1 - z0, y1 - y0), material);
  m.position.set((x0 + x1) / 2, (z0 + z1) / 2, (y0 + y1) / 2);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
const wallMeshes = [];       // pour les lancers de rayons (QC, occultation des étiquettes)
const collisionRects = [];   // pour la visite (2D)
function addWallBox(r, z0, z1, kind, id) {
  const m = boxMesh(r.x0, r.y0, r.x1, r.y1, z0, z1, MAT.mur);
  m.userData = { kind, id }; m.name = `${kind}:${id}`;
  groups.structure.add(m); wallMeshes.push(m);
  return m;
}
function addCap(r) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(r.x1 - r.x0, r.y1 - r.y0), MAT.coupe);
  m.rotation.x = -Math.PI / 2; m.position.set((r.x0 + r.x1) / 2, M.coupe + 0.05, (r.y0 + r.y1) / 2);
  groups.coupe.add(m);
}

/* ------------------------------------------------------------------ */
/* Murs                                                                */
/* ------------------------------------------------------------------ */
for (const w of GEO.walls) {
  const r = rectOf(w);
  addWallBox(r, 0, H, 'mur', w.id);
  addCap(r);
  collisionRects.push({ ...r, src: w.id });
}

/* ------------------------------------------------------------------ */
/* Ouvertures                                                          */
/* ------------------------------------------------------------------ */
function opFrame(op) {
  const ax = op.axe;
  const u0 = ax === 'x' ? op.x : op.y, u1 = ax === 'x' ? op.x + op.w : op.y + op.d;
  const t0 = ax === 'x' ? op.y : op.x, t1 = ax === 'x' ? op.y + op.d : op.x + op.w;
  const box = (ua, ub, ta, tb, za, zb, mat) => {
    const a0 = Math.min(ua, ub), a1 = Math.max(ua, ub), b0 = Math.min(ta, tb), b1 = Math.max(ta, tb);
    return ax === 'x' ? boxMesh(a0, b0, a1, b1, za, zb, mat) : boxMesh(b0, a0, b1, a1, za, zb, mat);
  };
  const pt = (u, t, h = 0) => ax === 'x' ? V3(u, h, t) : V3(t, h, u);
  return { u0, u1, t0, t1, box, pt };
}

const doorInfo = {};
function buildDoor(op, g) {
  const F = opFrame(op), P = M.porte;
  const W = F.u1 - F.u0, e = P.epaisseurVantail, s = op.ouverture;
  const dirU = op.gond === F.u0 ? 1 : -1;          // du gond vers l'autre tableau
  const pivotT = s > 0 ? F.t1 : F.t0;               // nu du mur côté ouverture
  const leaf = F.box(op.gond, op.gond + dirU * e, pivotT, pivotT + s * W, P.jeuSol, op.hauteur, MAT.menuiserie);
  leaf.userData = { kind: 'vantail', id: op.id }; leaf.name = 'vantail:' + op.id;
  g.add(leaf);
  const hp = P.hauteurPoignee, tH = pivotT + s * (W - P.poigneeDuChant), uC = op.gond + dirU * e / 2;
  for (const side of [-1, 1]) {
    const uf = uC + side * e / 2;
    g.add(F.box(uf, uf + side * 1, tH - 2.5, tH + 2.5, hp - 2.5, hp + 2.5, MAT.poignee));          // rosace

function buildWindow(op, g) {
  const F = opFrame(op), MM = M.menuiserie;
  const f = op.faceInterieure, s = ((F.t0 + F.t1) / 2 > f) ? 1 : -1;
  const D = MM.profondeurDormant, P = MM.largeurDormant, PS = MM.largeurOuvrant;
  const z0 = op.allege, z1 = op.allege + op.hauteur;
  const pb = op.type === 'baie' ? MM.seuilBaie : P;
  const add = (m, kind) => { m.userData = { kind, id: op.id }; g.add(m); return m; };
  // dormant, au nu intérieur
  add(F.box(F.u0, F.u0 + P, f, f + s * D, z0, z1, MAT.menuiserie), 'dormant');
  add(F.box(F.u1 - P, F.u1, f, f + s * D, z0, z1, MAT.menuiserie), 'dormant');
  add(F.box(F.u0, F.u1, f, f + s * D, z1 - P, z1, MAT.menuiserie), 'dormant');
  add(F.box(F.u0, F.u1, f, f + s * D, z0, z0 + pb, MAT.menuiserie), 'dormant');
  const ui0 = F.u0 + P, ui1 = F.u1 - P, zi0 = z0 + pb, zi1 = z1 - P;
  const sash = (ua, ub, ta, tb) => {
    add(F.box(ua, ua + PS, ta, tb, zi0, zi1, MAT.menuiserie), 'ouvrant');
    add(F.box(ub - PS, ub, ta, tb, zi0, zi1, MAT.menuiserie), 'ouvrant');
    add(F.box(ua, ub, ta, tb, zi1 - PS, zi1, MAT.menuiserie), 'ouvrant');
    add(F.box(ua, ub, ta, tb, zi0, zi0 + PS, MAT.menuiserie), 'ouvrant');
    const tm = (ta + tb) / 2;
    const gl = add(F.box(ua + PS, ub - PS, tm - 0.3, tm + 0.3, zi0 + PS, zi1 - PS, MAT.verre), 'vitrage');
    gl.castShadow = false;
  };
  let uh;
  if (op.type === 'baie') {
    const sw = (ui1 - ui0) / 2 + MM.recouvrementCoulissant / 2;
    sash(ui0, ui0 + sw, f + s * 0.5, f + s * 3.2);
    sash(ui1 - sw, ui1, f + s * 3.8, f + s * 6.5);
    uh = ui0 + sw - PS / 2;
    add(F.box(uh - 1, uh + 1, f + s * 0.5, f - s * 1.5, 95, 115, MAT.poignee), 'poignee');
  } else {
    const sw = (ui1 - ui0) / 2;
    sash(ui0, ui0 + sw, f + s * 1, f + s * 6);
    sash(ui0 + sw, ui1, f + s * 1, f + s * 6);
    uh = ui0 + sw - PS / 2;
    const zh = z0 + op.hauteur / 2;
    add(F.box(uh - 1, uh + 1, f + s * 1, f - s * 1.5, zh - 2, zh + 10, MAT.poignee), 'poignee');
  }
}

}

  }
}

/* ------------------------------------------------------------------ */
/* Pointeur : tap / clic, regard tactile, aperçu de mesure             */
/* ------------------------------------------------------------------ */
const pointers = new Map();
let tapCandidate = null;
canvas.addEventListener('pointerdown', e => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  tapCandidate = pointers.size === 1 ? { id: e.pointerId, x: e.clientX, y: e.clientY, t: performance.now() } : null;
  if (mode === 'visite' && !plc.isLocked && !look) look = { id: e.pointerId, x: e.clientX, y: e.clientY };
});
canvas.addEventListener('pointermove', e => {
  if (look && e.pointerId === look.id && mode === 'visite' && !plc.isLocked) {
    lookBy(e.clientX - look.x, e.clientY - look.y); look.x = e.clientX; look.y = e.clientY;
  }
  if (measure.active && measure.a && !measure.b && e.pointerType === 'mouse' && pointers.size === 0) {
    const fp = floorPoint(e.clientX, e.clientY); if (fp) drawMeasure(measure.a, fp.p, false);
  }
});
const pointerEnd = e => {
  pointers.delete(e.pointerId);
  if (look && look.id === e.pointerId) look = null;
  if (!tapCandidate || tapCandidate.id !== e.pointerId) return;
  const moved = Math.hypot(e.clientX - tapCandidate.x, e.clientY - tapCandidate.y), dt = performance.now() - tapCandidate.t;
  tapCandidate = null;
  if (e.type !== 'pointerup' || moved > 6 || dt > 600) return;
  if (mode === 'visite') { if (e.pointerType === 'mouse' && !plc.isLocked) plc.lock(); }
  else if (measure.active) measureTap(e.clientX, e.clientY);
};
canvas.addEventListener('pointerup', pointerEnd);
canvas.addEventListener('pointercancel', pointerEnd);

/* ------------------------------------------------------------------ */
/* Boussole                                                            */
/* ------------------------------------------------------------------ */
const NORTH = V3(Math.sin(M.nordDegres * Math.PI / 180), 0, -Math.cos(M.nordDegres * Math.PI / 180));
function updateCompass() {
  const cam = activeCam();
  let ref;
  if (mode === 'maquette') ref = orbit.target.clone();
  else if (mode === 'dessus') ref = orbitTop.target.clone();
  else { cam.getWorldDirection(_fwd); _fwd.y = 0; _fwd.normalize(); ref = cam.position.clone().addScaledVector(_fwd, 300); ref.y = 0; }
  const a = ref.clone().project(cam), b = ref.clone().addScaledVector(NORTH, 50).project(cam);
  const ang = Math.atan2((b.x - a.x) * innerWidth, (b.y - a.y) * innerHeight);
  ui.needle.setAttribute('transform', `rotate(${ang * 180 / Math.PI})`);
}

/* ------------------------------------------------------------------ */
/* Occultation des étiquettes en visite                                */
/* ------------------------------------------------------------------ */
const occRay = new THREE.Raycaster();
function occludeLabels(cam) {
  const cp = cam.position, cut = modeState[mode].coupe;
  for (const o of roomLabels) {
    const d = o.position.clone().sub(cp); const L = d.length(); d.normalize();
    occRay.set(cp, d); occRay.far = Math.max(0, L - 5);
    o.visible = !occRay.intersectObjects(wallMeshes, false).some(h => !cut || h.point.y <= M.coupe);
  }
}

/* ------------------------------------------------------------------ */
/* Boucle                                                              */
/* ------------------------------------------------------------------ */
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight);
  layoutCams();
});
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (mode === 'maquette') { orbit.update(); if (state.noms) occludeLabels(perspCam); }
  else if (mode === 'dessus') orbitTop.update();
  else { updateVisit(dt); if (state.noms) occludeLabels(visitCam); }
  const cam = activeCam();
  renderer.render(scene, cam);
  labelRenderer.render(scene, cam);
  updateCompass();
}
renderer.setAnimationLoop(frame);

/* ------------------------------------------------------------------ */
/* Interface de contrôle (QC automatisé)                               */
/* ------------------------------------------------------------------ */
function planBox(obj) {
  const b = new THREE.Box3().setFromObject(obj);
  const r = v => Math.round(v * 100) / 100;
  return { x: [r(b.min.x), r(b.max.x)], y: [r(b.min.z), r(b.max.z)], h: [r(b.min.y), r(b.max.y)] };
}
function hits(origin, dir, far) {
  const rc = new THREE.Raycaster(origin, dir.clone().normalize(), 0, far);
  return rc.intersectObjects(wallMeshes, false).map(h => h.object.name);
}
function qc() {
  scene.updateMatrixWorld(true);
  const out = { ouvertures: [], scans: {}, murs: [] };
  for (const w of GEO.walls) out.murs.push({ id: w.id, ...planBox(scene.getObjectByName('mur:' + w.id)) });
  for (const op of GEO.openings) {
    const F = opFrame(op), g = scene.getObjectByName('ouverture:' + op.id);
    const rec = { id: op.id, type: op.type, ensemble: planBox(g) };
    if (op.type === 'porte') { rec.vantail = planBox(scene.getObjectByName('vantail:' + op.id)); rec.gond = doorInfo[op.id].gond; }
    else { const parts = g.children.filter(c => c.userData.kind === 'dormant'); const bb = new THREE.Box3(); parts.forEach(p => bb.expandByObject(p)); rec.dormant = { x: [bb.min.x, bb.max.x], y: [bb.min.z, bb.max.z], h: [bb.min.y, bb.max.y] }; }
    // lancers de rayons à travers l'épaisseur du mur
    const top = op.allege + op.hauteur, zm = op.allege + op.hauteur / 2;
    const ray = (u, z) => {
      const o = F.pt(u, F.t0 - 5, z), o2 = F.pt(u, F.t1 + 5, z);
      return hits(o, o2.clone().sub(o), (F.t1 - F.t0) + 10).length > 0;
    };
    rec.tests = {
      videAuCentre: !ray((F.u0 + F.u1) / 2, zm),
      videBordDebut: !ray(F.u0 + 0.5, zm),
      videBordFin: !ray(F.u1 - 0.5, zm),
      tableauAvantDebut: ray(F.u0 - 0.5, zm),
      tableauApresFin: ray(F.u1 + 0.5, zm),
      videSousLinteau: !ray((F.u0 + F.u1) / 2, top - 0.5),
      linteauAuDessus: top < H ? ray((F.u0 + F.u1) / 2, top + 0.5) : null,
      allegeEnDessous: op.allege > 0 ? ray((F.u0 + F.u1) / 2, op.allege - 0.5) : null,
      videAuDessusAllege: op.allege > 0 ? !ray((F.u0 + F.u1) / 2, op.allege + 0.5) : null
    };
    out.ouvertures.push(rec);
  }
  // balayages des façades et murs : intervalles sans mur (à 150 cm et 50 cm de haut)
  const scan = (name, from, to, step, mk) => {
    const res = {};
    for (const z of [150, 50]) {
      const gaps = []; let s = null;
      for (let a = from; a <= to; a += step) {
        const [o, d, far] = mk(a, z); const hit = hits(o, d, far).length > 0;
        if (!hit && s === null) s = a; if (hit && s !== null) { gaps.push([s, a - step]); s = null; }
      }
      if (s !== null) gaps.push([s, to]);
      res['h' + z] = gaps;
    }
    out.scans[name] = res;
  };
  scan('mitoyen-g (x<0), le long de y', 0.5, 576.5, 1, (a, z) => [V3(-30, z, a), V3(1, 0, 0), 40]);
  scan('couloir (y<0), le long de x', -16.5, 1169.5, 1, (a, z) => [V3(a, z, -45), V3(0, 0, 1), 50]);
  scan('façade terrasse (y>577), le long de x', -16.5, 1169.5, 1, (a, z) => [V3(a, z, 660), V3(0, 0, -1), 90]);
  scan('façade droite (x>1110), le long de y', 0.5, 576.5, 1, (a, z) => [V3(1180, z, a), V3(-1, 0, 0), 80]);
  return out;
}

window.APP = {
  GEO, scene, setMode, goView, setToggle, qc,
  get mode() { return mode; },
  setMaquetteCamera(px, py, pz, tx, ty, tz) { perspCam.position.set(px, py, pz); orbit.target.set(tx, ty, tz); orbit.update(); },
  _cam: () => activeCam(),
  passages: () => passageResults.map(r => ({ id: r.id, nom: r.nom, largeur: +r.largeur.toFixed(1), entre: r.entre, a: r.a, b: r.b })),
  controles,
  recalculerPassages: () => computePassages(),
  ready: false
};
computePassages();
setMode('maquette');
requestAnimationFrame(() => { document.getElementById('loading').classList.add('hide'); window.APP.ready = true; });
</script>

    }

</script>
